<!DOCTYPE html>

    <style>
        body {
            background-color: #ffebf0; /* 연한 핑크 배경 */
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            width: 800px;
            background: #ffffff;
            border: 3px solid #ffb6c1;
            border-radius: 15px;
            box-shadow: 0 4px 25px rgba(255, 182, 193, 0.4);
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #ffccd5;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #d87093;
            font-size: 16px;
        }
        .content-area {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }
        .character-img-box {
            width: 220px;
            height: 260px;
            border: 2px solid #ffb6c1;
            border-radius: 10px;
            overflow: hidden;
            background-color: #fff0f5;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .character-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .story-box {
            flex-grow: 1;
            min-height: 220px;
            font-size: 16px;
            line-height: 1.6;
            color: #333333;
            background-color: #fff0f5;
            padding: 18px;
            border-radius: 10px;
            box-sizing: border-box;
            white-space: pre-line;
            display: flex;
            align-items: center;
        }
        .choices-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background-color: #ffb6c1;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }
        button:hover {
            background-color: #ff8fa3;
        }
    </style>
</head>

        </div>
    </div>

    <div class="choices-box" id="choices-container">
        <!-- 버튼이 동적으로 생성됩니다 -->
    </div>
</div>

            let endingText = "";
            
            if (score >= 8) {
                endingText = `[해피 엔딩: 온전한 마음의 결실]\n\n린이 얼굴을 아예 손으로 가린 채 귀끝까지 새빨개진 상태로 중얼거린다.\n\"…이렇게까지 사람 마음 흔들어놓고 모르는 척하기만 해봐. 평생 책임져야 할 테니까. 진짜로… 좋아해, 아주 많이.\"\n\n(최종 호감도: ${score}점 / 린의 마음을 완전히 열었습니다!)`;
            } else if (score >= 4) {
                endingText = `[노멀 엔딩: 서툴지만 따뜻한 거리감]\n\n린이 툴툴거리면서도 입꼬리를 살짝 올리며 미소 짓는다.\n\"앞으로도 그렇게 성가시게 굴면 가만안둬. …그래도 내일 축제는 기대해도 좋아, 바보야.\"\n\n(최종 호감도: ${score}점 / 린과의 안정적인 관계를 완성했습니다.)`;
            } else {
                endingText = `[배드 엔딩: 엇갈린 시선]\n\n린이 차갑게 시선을 거두며 교실 문을 열고 나선다.\n\"……내 그럴 줄 알았어. 너랑은 역시 어긋나기만 하네. 이만할, 됐어.\"\n\n(최종 호감도: ${score}점 / 린의 마음을 여는 데 실패했습니다.)`;
            }
            
            textEl.innerText = endingText;
            
            const restartBtn = document.createElement("button");
            restartBtn.innerText = "처음부터 다시하기";
            restartBtn.onclick = () => {
                currentPart = 1;
                currentStep = 1;
                score = 0;
                updateGame();
            };
            choicesEl.appendChild(restartBtn);
            return;
        }

        const currentScene = gameData[currentPart][currentStep];
        titleEl.innerText = currentScene.title;
        textEl.innerText = currentScene.text;

        currentScene.choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.innerText = choice.text;
            btn.onclick = () => {
                if (choice.score !== undefined) {
                    score += choice.score;
                }
                if (choice.nextPart) {
                    currentPart = choice.nextPart;
                    currentStep = choice.nextStep;
                } else {
                    currentStep = choice.nextStep;
                }
                updateGame();
            };
            choicesEl.appendChild(btn);
        });
    }

    // 초기 실행
    updateGame();
</script>

</body>
</html>
